<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>More Slides (Copy) (Copy)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">
  <!-- Reveal.js theme -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/white.css">
  <!-- Code syntax highlighting -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
</head>
<body class="">
  <div class="reveal" data-theme="white" data-code-theme="github">
    <div class="slides">
<section style="top: 350px; display: none;" class="editing-mode" spellcheck="false" hidden="" aria-hidden="true">
        <h1>More Slides</h1>
      </section>
<section style="top: 350px; display: none;" class="editing-mode" hidden="" aria-hidden="true">
        <h2>Slide 2</h2>
        <p>Add your content here...</p>
      </section>
<section style="top: 350px; display: block;" class="editing-mode" spellcheck="false" hidden="" aria-hidden="true">
        <h2>Code Example</h2>
        <pre><code class="language-javascript">// Your code here
function example() {
  return "Hello, World!";
}</code></pre>
      </section>
<section style="top: 350px; display: block;" class="editing-mode" hidden="" aria-hidden="true">
        <h2>Questions?</h2>
      </section>
<section style="top: 100px; display: block;" class="editing-mode" spellcheck="false">
<div class="sl-block" data-block-type="sandpack" style="left: 30px; top: 100px; width: 900px; height: 400px;" data-column-label="Column 1"><div class="sl-block-content"><div class="sandpack-embed" data-template="vanilla" data-theme="auto" data-layout="preview-right" data-show-console="true" data-editor-width="75"><script type="application/json" data-sandpack-files="">{
  "/index.html": "<!DOCTYPE html>\n<html>\n<head>\n  <link rel=\"stylesheet\" href=\"styles.css\">\n</head>\n<body>\n  <h1>Hello World</h1>\n  <p>Edit the code to see changes!</p>\n  <script src=\"index.js\"><\/script>\n</body>\n</html>",
  "/styles.css": "body {\n  font-family: system-ui, sans-serif;\n  padding: 20px;\n  margin: 0;\n}\n\nh1 {\n  color: #333;\n}",
  "/index.js": "// Your JavaScript code here\nconsole.log('Hello from JavaScript!');\n\ndocument.querySelector('h1').addEventListener('click', () => {\n  alert('Clicked!');\n});"
}</script></div></div></div></section>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/highlight.js"></script>
  <script>
    Reveal.initialize({
      hash: true,
      controls: true,
      progress: true,
      center: true,
      transition: 'slide',
      plugins: [RevealHighlight]
    });
  </script>
</body>
</html>
